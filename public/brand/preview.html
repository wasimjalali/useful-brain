<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Useful Brain · brand preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #171717; --canvas: #f8f8f8; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 14px/1.45 Nunito, ui-sans-serif, sans-serif;
      }
      main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 28px; color: #5c5c5c; }
      section { margin-bottom: 40px; }
      h2 { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #5c5c5c; margin: 0 0 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
      .panel { padding: 28px; border-radius: 12px; }
      .light { background: #fff; }
      .dark { background: #171717; }
      .mark { height: 160px; width: auto; display: block; }
      .lockup { height: 72px; width: auto; display: block; }
      .favicon { width: 64px; height: 64px; display: block; }
      img.source { width: min(100%, 520px); height: auto; border-radius: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Useful Brain brand</h1>
      <p>Traced SVGs on this branch. Check the mark, lockup, and favicon against your source.</p>

      <section>
        <h2>Your source</h2>
        <img class="source" src="/brand/source.jpg" alt="Finalized Useful Brain lockup, light and dark" />
      </section>

      <section>
        <h2>Mark</h2>
        <div class="row">
          <div class="panel light">
            <img class="mark" src="/brand/useful-brain-mark.svg" alt="Mark on light" />
          </div>
          <div class="panel dark">
            <img class="mark" src="/brand/useful-brain-mark-dark.svg" alt="Mark on dark" />
          </div>
        </div>
      </section>

      <section>
        <h2>Lockup</h2>
        <div class="row">
          <div class="panel light">
            <img class="lockup" src="/brand/useful-brain-logo.svg" alt="Lockup on light" />
          </div>
          <div class="panel dark">
            <img class="lockup" src="/brand/useful-brain-logo-dark.svg" alt="Lockup on dark" />
          </div>
        </div>
      </section>

      <section>
        <h2>Favicon</h2>
        <div class="panel dark" style="display:inline-block">
          <img class="favicon" src="/icon.svg" alt="App icon" />
        </div>
      </section>
    </main>
  </body>
</html>
