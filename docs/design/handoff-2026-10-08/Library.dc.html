<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ub-icon.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap"></helmet>
<div style="width:1440px; height:900px; display:flex; overflow:hidden; background:var(--canvas); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;">
  <dc-import name="Rail" active="library" chat="" hint-size="248px,900px"></dc-import>
  <main style="flex:1; min-width:0; margin:10px 10px 10px 0; display:flex; flex-direction:column; background:var(--surface); border-radius:24px; box-shadow:0 0 0 1px var(--edge), var(--stage-shadow); overflow:hidden;">
    <div style="padding:36px 48px 0;">
      <h1 style="margin:0; font-size:24px; line-height:32px; font-weight:600; letter-spacing:-0.02em;">Library</h1>
      <p style="margin:4px 0 0; font-size:13px; line-height:20px; color:var(--ink-muted);">{{ subtitle }}</p>
    </div>

    <div style="padding:24px 48px 0; display:flex; flex-direction:column; gap:14px;">
      <label style="position:relative; width:340px; height:36px; display:flex; align-items:center; gap:8px; padding:0 12px; box-sizing:border-box; border-radius:14px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--edge); color:var(--ink-faint-text);">
        <ub-icon name="search" size="15"></ub-icon>
        <sc-if value="{{ noQuery }}" hint-placeholder-val="{{ true }}"><span style="position:absolute; left:35px; font-size:13px; color:var(--ink-faint-text); pointer-events:none;">Search titles and sections</span></sc-if>
        <input aria-label="Search documents" value="{{ query }}" onChange="{{ onQuery }}" style="flex:1; min-width:0; height:100%; border:0; outline:0; padding:0; background:transparent; font:400 13px/1 var(--sans); color:var(--ink);">
        <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}"><button aria-label="Clear search" onClick="{{ clear }}" style="width:22px; height:22px; border:0; border-radius:6px; display:grid; place-items:center; background:transparent; color:var(--ink-muted); cursor:pointer;"><ub-icon name="x" size="14"></ub-icon></button></sc-if>
      </label>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="8">
          <sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}">
            <button aria-pressed="true" style="height:30px; display:inline-flex; align-items:center; gap:6px; padding:0 10px; border:0; border-radius:6px; background:var(--accent); color:var(--accent-ink); font:500 13px/1 var(--sans); cursor:pointer;">{{ c.label }}<span style="font-weight:400;">{{ c.count }}</span></button>
          </sc-if>
          <sc-if value="{{ c.off }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ c.pick }}" style="height:30px; display:inline-flex; align-items:center; gap:6px; padding:0 10px; border:0; border-radius:6px; background:var(--sunken); color:var(--ink); font:400 13px/1 var(--sans); cursor:pointer; transition:background-color 120ms cubic-bezier(0.22,1,0.36,1);" style-hover="background:var(--border-strong);">{{ c.label }}<span style="color:var(--ink-faint-text);">{{ c.count }}</span></button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="flex:1; min-height:0; overflow:hidden; padding:20px 36px 24px;">
      <div style="display:grid; grid-template-columns:minmax(0,1fr) 140px 280px 140px; column-gap:16px; align-items:center; height:32px; padding:0 12px; font-size:12px; font-weight:500; color:var(--ink-faint-text); border-bottom:1px solid var(--border);">
        <span>Document</span><span>Department</span><span>Who can read</span><span></span>
      </div>

      <sc-if value="{{ isReady }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; flex-direction:column; padding-top:4px;">
          <sc-for list="{{ docs }}" as="d" hint-placeholder-count="12">
            <div onMouseEnter="{{ d.enter }}" style="display:grid; grid-template-columns:minmax(0,1fr) 140px 280px 140px; column-gap:16px; align-items:center; height:46px; padding:0 12px; border-radius:10px; background:{{ d.bg }}; cursor:pointer; transition:background-color 120ms cubic-bezier(0.22,1,0.36,1);">
              <span style="min-width:0; display:flex; align-items:center; gap:10px;"><span style="display:inline-flex; color:var(--ink-muted);"><ub-icon name="file-text" size="16"></ub-icon></span><span style="font-size:14px; font-weight:500; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ d.title }}</span></span>
              <span style="font-size:13px; color:var(--ink-muted);">{{ d.dept }}</span>
              <span style="font-size:13px; color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ d.readers }}</span>
              <span style="display:flex; justify-content:flex-end;">
                <sc-if value="{{ d.hot }}" hint-placeholder-val="{{ false }}">
                  <button style="height:30px; display:inline-flex; align-items:center; gap:6px; padding:0 11px 0 9px; border:0; border-radius:10px; background:var(--bubble); box-shadow:var(--sel); font:500 12px/1 var(--sans); color:var(--ink); cursor:pointer; white-space:nowrap;"><ub-icon name="message-square" size="14"></ub-icon>Ask about this</button>
                </sc-if>
              </span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
        <div aria-busy="true" style="display:flex; flex-direction:column; padding-top:4px;">
          <sc-for list="{{ skeleton }}" as="k" hint-placeholder-count="12">
            <div style="display:grid; grid-template-columns:minmax(0,1fr) 140px 280px 140px; column-gap:16px; align-items:center; height:46px; padding:0 12px;">
              <span style="display:flex; align-items:center; gap:10px;"><span style="width:16px; height:16px; border-radius:4px; background:var(--sunken);"></span><span style="height:10px; width:{{ k.w }}; border-radius:6px; background:var(--sunken);"></span></span>
              <span style="height:10px; width:72px; border-radius:6px; background:var(--sunken);"></span>
              <span style="height:10px; width:{{ k.r }}; border-radius:6px; background:var(--sunken);"></span>
              <span></span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="padding:56px 12px 0; display:flex; flex-direction:column; align-items:flex-start; gap:6px; max-width:520px;">
          <span style="font-size:15px; font-weight:500; color:var(--ink);">Nothing you can read matches “{{ query }}”</span>
          <span style="font-size:13px; line-height:20px; color:var(--ink-muted);">It may not exist yet, or it may be restricted to another team.</span>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button style="height:34px; display:inline-flex; align-items:center; gap:7px; padding:0 14px 0 12px; border:0; border-radius:10px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--edge); font:500 13px/1 var(--sans); color:var(--ink); cursor:pointer;" style-hover="background:var(--border-strong);"><ub-icon name="file-plus" size="15"></ub-icon>Request this document</button>
            <button onClick="{{ clear }}" style="height:34px; padding:0 12px; border:0; border-radius:10px; background:transparent; font:500 13px/1 var(--sans); color:var(--ink-muted); cursor:pointer;" style-hover="background:var(--sunken); color:var(--ink);">Clear search</button>
          </div>
        </div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;ready&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { dept: 'All', hot: null, query: null };
  renderVals() {
    const mode = this.props.state ?? 'ready';
    const E = 'Everyone';
    const all = [
      ['Anti-Harassment Policy', 'HR', E], ['API and Integration Standards', 'Engineering', E], ['Atlas Connector Catalog', 'Engineering', 'Engineering, Support, Sales'],
      ['Atlas Sync Troubleshooting Runbook', 'Support', 'Support, Engineering'], ['Business Continuity Policy', 'Operations', 'Operations, Engineering, Executive'],
      ['Change Management Policy', 'Engineering', E], ['Channel and Hours', 'Support', E], ['Data Retention Policy', 'Legal', E],
      ['Disaster Recovery Runbook', 'Operations', 'Operations, Engineering, Executive'], ['Employee Expense Policy', 'Finance', E], ['Employee Handbook', 'HR', E],
      ['Equipment Return Policy', 'Operations', E], ['Incident Escalation Matrix', 'Engineering', 'Engineering, Support, Operations'], ['IP and Confidentiality Policy', 'Legal', E],
      ['Knowledge Base Article Guidelines', 'Support', E], ['Leave and Time Off Policy', 'HR', E], ['Meridian Portal Administration Guide', 'Support', E],
      ['New Hire Onboarding Program Guide', 'HR', E], ['Northwind Core Error Code Reference', 'Engineering', 'Engineering, Support'], ['Northwind Core Release Notes 2026', 'Engineering', E],
      ['Office and Facilities Policy', 'Operations', E], ['On-Call Rotation', 'Engineering', E], ['Parental Leave Policy', 'HR', E], ['Privacy Policy', 'Legal', E],
      ['Recruiting and Interview Policy', 'HR', 'HR, Engineering, Sales'], ['Referral Program', 'Sales', E], ['Remote Work and Flexible Hours', 'HR', E],
      ['Scheduled Maintenance Policy', 'Operations', 'Operations, Engineering'], ['Software Development Lifecycle', 'Engineering', 'Engineering'], ['Support SLA Policy', 'Support', E],
      ['System Log Retention Policy', 'Engineering', 'Engineering'], ['Tax Withholding Policy', 'Finance', E], ['Ticket Handling and Priority Policy', 'Support', E], ['Travel Expense Policy', 'Finance', E],
    ];
    const query = this.state.query ?? (mode === 'empty' ? '2027 holiday calendar' : '');
    const q = query.trim().toLowerCase();
    const dept = this.state.dept;
    const matchQ = all.filter(([t]) => !q || t.toLowerCase().includes(q));
    const shown = matchQ.filter(([, d]) => dept === 'All' || d === dept);
    const hot = this.state.hot ?? (mode === 'ready' ? 2 : -1);
    const depts = ['Engineering', 'HR', 'Support', 'Operations', 'Finance', 'Legal', 'Sales'];
    const count = d => matchQ.filter(r => d === 'All' || r[1] === d).length;
    const chips = ['All', ...depts].map(label => ({ label, count: count(label), on: label === dept, off: label !== dept, pick: () => this.setState({ dept: label }) }));
    const empty = mode !== 'loading' && shown.length === 0;
    return {
      subtitle: mode === 'loading' ? 'Loading documents you can read' : '34 documents you can read',
      query, noQuery: !query, hasQuery: !!query,
      onQuery: e => this.setState({ query: e.target.value }),
      clear: () => this.setState({ query: '', dept: 'All' }),
      chips,
      isReady: mode !== 'loading' && !empty, isLoading: mode === 'loading', isEmpty: empty,
      docs: shown.map(([title, d, readers], i) => ({ title, dept: d, readers, hot: i === hot, bg: i === hot ? 'var(--sunken)' : 'transparent', enter: () => this.setState({ hot: i }) })),
      skeleton: [220, 300, 180, 260, 340, 200, 240, 160, 310, 230, 190, 270].map((w, i) => ({ w: w + 'px', r: [70, 150, 70, 110, 190, 70, 70, 130, 70, 90, 70, 160][i] + 'px' })),
    };
  }
}
</script>
</body>
</html>
