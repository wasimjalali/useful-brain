<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ub-icon.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap"></helmet>
<div style="position:relative; width:1440px; height:900px; overflow:hidden; font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;">
  <dc-import name="Sources" draft="building" hint-size="1440px,900px"></dc-import>
  <div style="position:absolute; inset:0; background:var(--scrim); display:flex; align-items:flex-start; justify-content:center; padding-top:96px;">
    <div role="dialog" aria-modal="true" aria-labelledby="up-title" style="width:560px; border-radius:16px; background:var(--bubble); box-shadow:0 0 0 1px var(--edge), var(--lift), 0 24px 64px -24px rgb(0 0 0 / 0.35); overflow:hidden;">
      <div style="height:56px; display:flex; align-items:center; padding:0 12px 0 24px;">
        <h2 id="up-title" style="flex:1; margin:0; font-size:16px; font-weight:600; letter-spacing:-0.01em;">Upload documents</h2>
        <button aria-label="Close" style="width:32px; height:32px; border:0; border-radius:10px; display:grid; place-items:center; background:transparent; color:var(--ink-muted); cursor:pointer;" style-hover="background:var(--sunken); color:var(--ink);"><ub-icon name="x" size="16"></ub-icon></button>
      </div>

      <div style="padding:0 24px; display:flex; flex-direction:column; gap:20px;">
        <div style="height:112px; border-radius:14px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--edge); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; cursor:pointer;" style-hover="background:var(--border);">
          <span style="display:inline-flex; color:var(--ink-muted);"><ub-icon name="file-up" size="20"></ub-icon></span>
          <span style="font-size:13px; color:var(--ink);">Drop files here, or <span style="font-weight:500; text-decoration:underline; text-underline-offset:2px;">browse</span></span>
          <span style="font-size:12px; color:var(--ink-faint-text);">PDF, DOCX or Markdown, up to 25 MB each</span>
        </div>

        <div style="display:flex; flex-direction:column;">
          <sc-for list="{{ files }}" as="f" hint-placeholder-count="4">
            <div style="display:grid; grid-template-columns:16px minmax(0,1fr) auto 112px; column-gap:10px; align-items:center; height:44px; border-bottom:1px solid var(--border);">
              <span style="display:inline-flex; color:var(--ink-muted);"><ub-icon name="file-text" size="16"></ub-icon></span>
              <span style="min-width:0; display:flex; align-items:baseline; gap:8px;"><span style="font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ f.name }}</span><span style="font-size:12px; color:var(--ink-faint-text); flex-shrink:0;">{{ f.size }}</span></span>
              <span style="font-size:12px; color:{{ f.tone }}; display:inline-flex; align-items:center; gap:5px;">{{ f.stage }}</span>
              <span aria-hidden="true" style="display:grid; grid-template-columns:repeat(4,1fr); gap:3px;">
                <span style="height:4px; border-radius:999px; background:{{ f.s0 }};"></span>
                <span style="height:4px; border-radius:999px; background:{{ f.s1 }};"></span>
                <span style="height:4px; border-radius:999px; background:{{ f.s2 }};"></span>
                <span style="height:4px; border-radius:999px; background:{{ f.s3 }};"></span>
              </span>
            </div>
          </sc-for>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px;">
          <span style="font-size:13px; font-weight:500;">Who can read these</span>
          <div role="radiogroup" style="display:inline-flex; width:max-content; gap:2px; padding:3px; border-radius:10px; background:var(--sunken);">
            <sc-for list="{{ scopes }}" as="s" hint-placeholder-count="3">
              <sc-if value="{{ s.on }}" hint-placeholder-val="{{ false }}"><span role="radio" aria-checked="true" style="height:28px; padding:0 14px; display:inline-flex; align-items:center; border-radius:8px; background:var(--bubble); box-shadow:var(--sel); font-size:13px; font-weight:500;">{{ s.label }}</span></sc-if>
              <sc-if value="{{ s.off }}" hint-placeholder-val="{{ true }}"><span role="radio" aria-checked="false" onClick="{{ s.pick }}" style="height:28px; padding:0 14px; display:inline-flex; align-items:center; border-radius:8px; font-size:13px; color:var(--ink-muted); cursor:pointer;" style-hover="color:var(--ink);">{{ s.label }}</span></sc-if>
            </sc-for>
          </div>
          <sc-if value="{{ showGroups }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              <sc-for list="{{ groups }}" as="g" hint-placeholder-count="8">
                <sc-if value="{{ g.on }}" hint-placeholder-val="{{ false }}"><button aria-pressed="true" onClick="{{ g.toggle }}" style="height:28px; display:inline-flex; align-items:center; gap:5px; padding:0 9px 0 7px; border:0; border-radius:6px; background:var(--accent); color:var(--accent-ink); font:500 12px/1 var(--sans); cursor:pointer;"><ub-icon name="check" size="13" stroke="2"></ub-icon>{{ g.label }}</button></sc-if>
                <sc-if value="{{ g.off }}" hint-placeholder-val="{{ true }}"><button aria-pressed="false" onClick="{{ g.toggle }}" style="height:28px; padding:0 9px; border:0; border-radius:6px; background:var(--sunken); color:var(--ink); font:400 12px/1 var(--sans); cursor:pointer;" style-hover="background:var(--border-strong);">{{ g.label }}</button></sc-if>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ isEveryone }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px; color:var(--ink-faint-text);">All 148 people at Northwind.</span></sc-if>
        </div>

        <div style="display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:20px; color:var(--ink-muted);"><span style="display:inline-flex; margin-top:2px; color:var(--ink-muted);"><ub-icon name="layers" size="15"></ub-icon></span><span>Files go into a draft. Nothing changes for readers until you promote it.</span></div>
      </div>

      <div style="display:flex; align-items:center; gap:8px; padding:20px 16px 16px 24px; margin-top:4px;">
        <span style="flex:1; font-size:12px; color:var(--ink-faint-text);">{{ readyLine }}</span>
        <button style="height:36px; padding:0 14px; border:0; border-radius:10px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--edge); font:500 13px/1 var(--sans); color:var(--ink); cursor:pointer;" style-hover="background:var(--border-strong);">Cancel</button>
        <sc-if value="{{ allReady }}" hint-placeholder-val="{{ false }}"><button style="height:36px; padding:0 14px; border:0; border-radius:10px; background:var(--accent); font:500 13px/1 var(--sans); color:var(--accent-ink); cursor:pointer;" style-hover="opacity:0.86;">Add to draft</button></sc-if>
        <sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}"><button disabled style="height:36px; padding:0 14px; border:0; border-radius:10px; background:var(--sunken); font:500 13px/1 var(--sans); color:var(--ink-faint-text); cursor:not-allowed;">Add to draft</button></sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { t: 0, scope: null, groups: { HR: true, Operations: true } };
  componentDidMount() { this.timer = setInterval(() => this.setState(s => ({ t: s.t >= 9 ? 0 : s.t + 1 })), 1100); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const stages = ['Parsing', 'Chunking', 'Embedding', 'Ready'];
    const base = [
      ['holiday-calendar-2027.pdf', '412 KB', 3],
      ['home-office-stipend-policy.docx', '88 KB', 2],
      ['office-parking-and-visitor-access.md', '6 KB', 1],
      ['client-visit-dress-code.pdf', '1.2 MB', 0],
    ];
    const t = this.state.t;
    const files = base.map(([name, size, st0]) => {
      const st = Math.min(3, st0 + Math.floor(t / 2));
      const seg = i => i < st || st === 3 ? 'var(--ink)' : i === st ? 'var(--ink-faint)' : 'var(--sunken)';
      return { name, size, stage: stages[st], tone: st === 3 ? 'var(--success)' : 'var(--ink-muted)', s0: seg(0), s1: seg(1), s2: seg(2), s3: seg(3), ready: st === 3 };
    });
    const nReady = files.filter(f => f.ready).length;
    const scope = this.state.scope ?? 'Departments';
    const depts = ['Engineering', 'Executive', 'Finance', 'HR', 'Legal', 'Operations', 'Sales', 'Support'];
    const roles = ['Managers', 'Directors', 'HR managers', 'Finance managers', 'Support managers', 'Sales managers'];
    const list = scope === 'Roles' ? roles : depts;
    return {
      files,
      allReady: nReady === files.length, notReady: nReady < files.length,
      readyLine: nReady === files.length ? '4 files ready' : `${nReady} of ${files.length} ready`,
      scopes: ['Everyone', 'Departments', 'Roles'].map(label => ({ label, on: label === scope, off: label !== scope, pick: () => this.setState({ scope: label }) })),
      showGroups: scope !== 'Everyone', isEveryone: scope === 'Everyone',
      groups: list.map(label => { const on = !!this.state.groups[label]; return { label, on, off: !on, toggle: () => this.setState(s => ({ groups: { ...s.groups, [label]: !s.groups[label] } })) }; }),
    };
  }
}
</script>
</body>
</html>
