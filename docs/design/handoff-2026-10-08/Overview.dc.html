<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ub-icon.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap"></helmet>
<div style="width:1440px; height:900px; display:flex; overflow:hidden; background:var(--canvas); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;">
  <dc-import name="Rail" active="overview" chat="" admin="{{ true }}" hint-size="248px,900px"></dc-import>
  <main style="flex:1; min-width:0; margin:10px 10px 10px 0; display:flex; flex-direction:column; background:var(--surface); border-radius:24px; box-shadow:0 0 0 1px var(--edge), var(--stage-shadow); overflow:hidden;">
    <div style="padding:36px 48px 0; display:flex; align-items:flex-end; gap:16px;">
      <div style="flex:1; min-width:0;">
        <h1 style="margin:0; font-size:24px; line-height:32px; font-weight:600; letter-spacing:-0.02em;">Overview</h1>
        <p style="margin:4px 0 0; font-size:13px; line-height:20px; color:var(--ink-muted);">This week · 1 to 7 Oct 2026</p>
      </div>
    </div>

    <div style="margin:28px 48px 0; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border-radius:16px; background:var(--bubble); box-shadow:0 0 0 1px var(--edge), var(--lift);">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
        <div style="padding:18px 20px 16px; display:flex; flex-direction:column; gap:4px; box-shadow:{{ k.rule }};">
          <span style="font-size:12px; font-weight:500; color:var(--ink-faint-text);">{{ k.label }}</span>
          <div style="display:flex; align-items:baseline; gap:8px;">
            <span style="font-size:28px; line-height:36px; font-weight:600; letter-spacing:-0.02em; color:var(--ink);">{{ k.value }}</span>
            <span style="font-size:12px; color:var(--ink-muted);">{{ k.delta }}</span>
          </div>
          <svg viewBox="0 0 120 28" preserveAspectRatio="none" aria-hidden="true" style="width:100%; height:28px; margin-top:6px; overflow:visible;">
            <polyline points="{{ k.pts }}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
          </svg>
          <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint-text);"><span>Thu</span><span>Wed</span></div>
        </div>
      </sc-for>
    </div>

    <div style="flex:1; min-height:0; overflow:hidden; padding:36px 48px 24px; display:grid; grid-template-columns:minmax(0,1fr) 380px; column-gap:48px;">
      <section style="min-width:0; display:flex; flex-direction:column;">
        <div style="display:flex; align-items:baseline; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--border);">
          <h2 style="margin:0; font-size:12px; font-weight:500; color:var(--ink-faint-text);">Unanswered questions</h2>
          <span style="font-size:12px; color:var(--ink-faint-text);">What to add next</span>
          <span style="margin-left:auto; font-size:12px; color:var(--ink-faint-text);">Asks</span>
        </div>
        <sc-for list="{{ gaps }}" as="g" hint-placeholder-count="5">
          <div onMouseEnter="{{ g.enter }}" style="display:grid; grid-template-columns:minmax(0,1fr) auto 40px; column-gap:16px; align-items:center; min-height:60px; padding:8px 12px; margin:0 -12px; border-radius:10px; background:{{ g.bg }}; transition:background-color 120ms cubic-bezier(0.22,1,0.36,1);">
            <div style="min-width:0; display:flex; flex-direction:column; gap:2px;">
              <span style="font-size:14px; line-height:20px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ g.q }}</span>
              <span style="font-size:12px; line-height:16px; color:var(--ink-faint-text);">{{ g.meta }}</span>
            </div>
            <span style="display:flex; justify-content:flex-end; min-width:116px;">
              <sc-if value="{{ g.hot }}" hint-placeholder-val="{{ false }}">
                <button style="height:30px; display:inline-flex; align-items:center; gap:6px; padding:0 11px 0 9px; border:0; border-radius:10px; background:var(--bubble); box-shadow:var(--sel); font:500 12px/1 var(--sans); color:var(--ink); cursor:pointer; white-space:nowrap;"><ub-icon name="upload" size="14"></ub-icon>Add document</button>
              </sc-if>
            </span>
            <span style="text-align:right; font-size:14px; font-weight:500; color:var(--ink);">{{ g.n }}</span>
          </div>
        </sc-for>
      </section>

      <div style="min-width:0; display:flex; flex-direction:column; gap:32px;">
        <section style="display:flex; flex-direction:column;">
          <div style="display:flex; align-items:baseline; padding-bottom:10px; border-bottom:1px solid var(--border);">
            <h2 style="margin:0; font-size:12px; font-weight:500; color:var(--ink-faint-text);">System</h2>
            <span style="margin-left:auto; font-size:12px; color:var(--warning);">1 warning</span>
          </div>
          <sc-for list="{{ system }}" as="s" hint-placeholder-count="5">
            <div style="display:flex; align-items:center; gap:10px; height:40px; border-bottom:1px solid var(--border);">
              <span style="width:7px; height:7px; border-radius:999px; flex-shrink:0; background:{{ s.dot }};"></span>
              <span style="flex:1; font-size:13px; color:var(--ink);">{{ s.name }}</span>
              <span style="font-size:12px; color:{{ s.tone }}; font-family:{{ s.font }};">{{ s.detail }}</span>
            </div>
          </sc-for>
        </section>

        <section style="display:flex; flex-direction:column;">
          <div style="display:flex; align-items:baseline; padding-bottom:10px; border-bottom:1px solid var(--border);">
            <h2 style="margin:0; font-size:12px; font-weight:500; color:var(--ink-faint-text);">Evals</h2>
            <span style="margin-left:auto; font-size:12px; color:var(--ink-faint-text);">Latest run 6 Sep 2026</span>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; padding:14px 0 12px;">
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-size:22px; line-height:28px; font-weight:600; letter-spacing:-0.02em;">118<span style="color:var(--ink-faint-text); font-weight:500;">/120</span></span>
              <span style="font-size:12px; color:var(--ink-muted);">Questions passed</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-size:22px; line-height:28px; font-weight:600; letter-spacing:-0.02em; color:var(--success);">0</span>
              <span style="font-size:12px; color:var(--ink-muted);">ACL leaks</span>
            </div>
          </div>
          <span role="link" style="display:inline-flex; align-items:center; gap:4px; width:max-content; font-size:12px; font-weight:500; color:var(--ink-muted); cursor:pointer;" style-hover="color:var(--ink);">Open evals<ub-icon name="arrow-right" size="13"></ub-icon></span>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { hot: null };
  renderVals() {
    const spark = (vals) => {
      const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
      return vals.map((v, i) => `${(i / (vals.length - 1) * 120).toFixed(1)},${(26 - (v - min) / r * 24).toFixed(1)}`).join(' ');
    };
    const k = [
      ['Questions this week', '214', '+12% on last week', [24, 31, 28, 35, 33, 30, 33]],
      ['Answered with citations', '91.6%', '+0.8 pts', [90.2, 91.0, 92.4, 91.1, 92.0, 91.8, 92.6]],
      ['No evidence', '18', '8.4% of questions', [3, 2, 4, 2, 3, 2, 2]],
      ['Median answer', '2.4 s', '−0.2 s', [2.6, 2.5, 2.4, 2.5, 2.3, 2.4, 2.4]],
    ];
    const hot = this.state.hot ?? 0;
    const gaps = [
      ['When is the 2027 company holiday calendar published?', 'Last asked today · 1 document request · likely HR', 6],
      ['Is there a home office internet stipend?', 'Last asked yesterday · likely Operations', 4],
      ['Is there parking at the office for visitors?', 'Last asked 3 Oct · likely Operations', 3],
      ['What is the dress code for client visits?', 'Last asked 2 Oct · likely HR', 3],
      ['Do we run a mentorship program for new managers?', 'Last asked 1 Oct · likely HR', 2],
    ];
    const ok = ['var(--success)', 'var(--ink-muted)', 'var(--sans)'];
    return {
      kpis: k.map(([label, value, delta, vals], i) => ({ label, value, delta, pts: spark(vals), rule: i ? 'inset 1px 0 0 var(--border)' : 'none' })),
      gaps: gaps.map(([q, meta, n], i) => ({ q, meta, n, hot: i === hot, bg: i === hot ? 'var(--sunken)' : 'transparent', enter: () => this.setState({ hot: i }) })),
      system: [
        ['Brain worker', 'Healthy', ok],
        ['Corpus database', 'Healthy', ok],
        ['Vector index', 'Synced to g-c305cf57', ['var(--success)', 'var(--ink-muted)', 'var(--mono)']],
        ['Workers AI', 'Healthy', ok],
        ['AI Gateway', '2 retries in the last hour', ['var(--warning)', 'var(--warning)', 'var(--sans)']],
      ].map(([name, detail, [dot, tone, font]]) => ({ name, detail, dot, tone, font })),
    };
  }
}
</script>
</body>
</html>
