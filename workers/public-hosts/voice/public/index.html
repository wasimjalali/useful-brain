<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Useful Voice</title>
    <style>
      :root {
        --canvas: #f8f8f8;
        --ink: #171717;
        --ink-muted: #5c5c5c;
      }
      html, body { margin: 0; background: var(--canvas); color: var(--ink); }
      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main { width: min(100%, 32rem); }
      h1 { margin: 0; font-size: 2rem; letter-spacing: -0.04em; }
      p { color: var(--ink-muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Useful Voice</h1>
      <p>This hostname is reserved. The product is not public yet.</p>
    </main>
  </body>
</html>
